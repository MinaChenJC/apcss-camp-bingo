<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APCSS Camp 賓果</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 100%; }
        h1 { color: #1a73e8; }
        #display-area { font-size: 5rem; font-weight: bold; margin: 20px 0; min-height: 120px; color: #333; display: flex; align-items: center; justify-content: center; }
        #card-desc { font-size: 1.2rem; color: #d93025; font-weight: bold; margin-bottom: 20px; min-height: 1.5rem; padding: 0 10px; }
        .controls { margin-bottom: 30px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #history { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .num-tag { background: #e8f0fe; color: #1a73e8; padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; border: 1px solid transparent; }
        .bomb-tag { background: #fce8e6; color: #d93025; border: 1px solid #d93025; }
        .luck-tag { background: #e6f4ea; color: #1e8e3e; border: 1px solid #1e8e3e; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌪️ 味覺重啟：貢丸代號 Ω</h1>
    
    <div id="display-area">準備？</div>
    <div id="card-desc"></div>

    <div class="controls">
        <button id="draw-btn" onclick="draw()">開始抽籤</button>
        <button onclick="resetGame()" style="background:#607d8b; margin-left:10px;">重置遊戲</button>
    </div>

    <h3>已抽出的紀錄：</h3>
    <div id="history"></div>
</div>

<script>
    // --- 1. 變數初始化 ---
    let pool = Array.from({length: 48}, (_, i) => i + 1); // 1-48 號
    let negativeQueue = ["💣 炸彈", "💣 炸彈", "🔪 偷襲"]; 
    let luckQueue = ["🌟 萬用號碼"]; 
    let resurrectionQueue = ["😇 復活！"]; 

    let drawn = [];
    let noActionCount = 0; // 連續沒出事的計數器
    const FORCE_TRIGGER_LIMIT = 6; // 保底次數

    const display = document.getElementById('display-area');
    const desc = document.getElementById('card-desc');
    const historyDiv = document.getElementById('history');
    const drawBtn = document.getElementById('draw-btn');

    // --- 2. 核心抽籤邏輯 ---
    function draw() {
        if (pool.length === 0 && negativeQueue.length === 0 && luckQueue.length === 0 && resurrectionQueue.length === 0) {
            display.innerText = "結束";
            desc.innerText = "所有內容已抽完！";
            drawBtn.disabled = true;
            return;
        }

        let result;
        let numberCount = drawn.filter(item => typeof item === 'number').length;

        // 階段 A：前三抽絕對保護 (純數字)
        if (numberCount < 3) {
            const index = Math.floor(Math.random() * pool.length);
            result = pool[index];
            pool.splice(index, 1);
            noActionCount++;
        } 
        // 階段 B：混沌期 (三抽後)
        else {
            let negUnlocked = (negativeQueue.length > 0); 
            let luckUnlocked = (luckQueue.length > 0); 
            let resUnlocked = (resurrectionQueue.length > 0 && drawn.some(item => item === "💣 炸彈" || item === "🔪 偷襲"));

            // 檢查是否觸發保底
            if ((negUnlocked || luckUnlocked || resUnlocked) && (noActionCount >= FORCE_TRIGGER_LIMIT)) {
                result = triggerSpecialCard(negUnlocked, luckUnlocked, resUnlocked);
                noActionCount = 0;
            } 
            // 隨機抽取 (混入已解鎖道具)
            else {
                let currentTempPool = [...pool];
                if (negUnlocked) currentTempPool.push(...negativeQueue);
                if (luckUnlocked) currentTempPool.push(...luckQueue);
                if (resUnlocked) currentTempPool.push(...resurrectionQueue);

                const index = Math.floor(Math.random() * currentTempPool.length);
                result = currentTempPool[index];

                if (typeof result === 'number') {
                    pool = pool.filter(n => n !== result);
                    noActionCount++;
                } else {
                    removeSpecialFromQueue(result);
                    noActionCount = 0;
                }
            }
        }

        drawn.push(result);
        display.innerText = result;
        updateDescription(result);
        updateHistory();
    }

    // --- 3. 輔助工具函式 ---

    function triggerSpecialCard(neg, luck, res) {
        let temp = [];
        if (neg) temp.push(...negativeQueue);
        if (luck) temp.push(...luckQueue);
        if (res) temp.push(...resurrectionQueue);
        const i = Math.floor(Math.random() * temp.length);
        const card = temp[i];
        removeSpecialFromQueue(card);
        return card;
    }

    function removeSpecialFromQueue(card) {
        if (negativeQueue.includes(card)) negativeQueue.splice(negativeQueue.indexOf(card), 1);
        else if (luckQueue.includes(card)) luckQueue.splice(luckQueue.indexOf(card), 1);
        else if (resurrectionQueue.includes(card)) resurrectionQueue.splice(resurrectionQueue.indexOf(card), 1);
    }

    function updateDescription(res) {
        if (res === "💣 炸彈") {
            desc.innerText = "喔不！炸彈引爆！這回合每組必須取消一個已標記的號碼";
            display.style.color = "#d93025";
        } else if (res === "🔪 偷襲") {
            desc.innerText = "嘻嘻！每組可以把下一組的一個標記取消！";
            display.style.color = "#f9ab00";
        } else if (res === "🌟 萬用號碼") {
            desc.innerText = "幸運女神降臨！每個小組可以自由選擇一個數字標記！";
            display.style.color = "#188038";
        } else if (res === "😇 復活！") {
            desc.innerText = "這回合可以復活一個剛剛取消掉的標記";
            display.style.color = "#1a73e8";
        } else {
            desc.innerText = "";
            display.style.color = "#333";
        }
    }

    function updateHistory() {
        historyDiv.innerHTML = drawn.map(item => {
            const isAction = typeof item === 'string';
            let specialClass = "";
            if (item === "🌟 萬用號碼") specialClass = "luck-tag";
            else if (isAction) specialClass = "bomb-tag";
            return `<span class="num-tag ${specialClass}">${item}</span>`;
        }).join('');
    }

    function resetGame() {
        if(confirm("確定要重置嗎？")) {
            location.reload();
        }
    }
</script>

</body>
</html>
