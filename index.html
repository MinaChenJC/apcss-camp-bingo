<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APCSS Camp 賓果</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 100%; }
        h1 { color: #1a73e8; }
        #display-area { font-size: 5rem; font-weight: bold; margin: 20px 0; min-height: 120px; color: #333; display: flex; align-items: center; justify-content: center; }
        #card-desc { font-size: 1.2rem; color: #d93025; font-weight: bold; margin-bottom: 20px; min-height: 1.5rem; }
        .controls { margin-bottom: 30px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #1557b0; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #history { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .num-tag { background: #e8f0fe; color: #1a73e8; padding: 5px 10px; border-radius: 5px; font-size: 0.9rem; }
        .bomb-tag { background: #fce8e6; color: #d93025; border: 1px solid #d93025; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌪️ 味覺重啟：貢丸代號 Ω</h1>
    
    <div id="display-area">準備？</div>
    <div id="card-desc"></div>

    <div class="controls">
        <button id="draw-btn" onclick="draw()">開始抽籤</button>
        <button onclick="resetGame()" style="background:#607d8b; margin-left:10px;">重置遊戲</button>
    </div>

    <h3>已抽出的號碼：</h3>
    <div id="history"></div>
</div>

<script>
function draw() {
    // 0. 檢查總池子是否空了
    if (pool.length === 0 && negativeQueue.length === 0 && luckQueue.length === 0 && resurrectionQueue.length === 0) {
        display.innerText = "結束";
        desc.innerText = "所有內容已抽完！";
        drawBtn.disabled = true;
        return;
    }

    let result;
    // 計算目前已經抽出的「純數字」數量
    let numberCount = drawn.filter(item => typeof item === 'number').length;

    // --- 階段 1：絕對數字保護期 (前三號碼) ---
    if (numberCount < 3) {
        const index = Math.floor(Math.random() * pool.length);
        result = pool[index];
        pool.splice(index, 1); // 從數字池移除
        noActionCount++;       // 雖然是保護期，但也累計「沒出事」次數
    } 
    // --- 階段 2：混沌開啟 (三號碼之後) ---
    else {
        // 判斷各類卡片解鎖狀態
        let negUnlocked = (negativeQueue.length > 0); 
        let luckUnlocked = (luckQueue.length > 0); 
        let resUnlocked = (resurrectionQueue.length > 0 && drawn.some(item => item === "💣 炸彈" || item === "🔪 偷襲"));

        // A. 觸發「保底機制」：如果太久沒出事，且有道具已解鎖
        if ((negUnlocked || luckUnlocked || resUnlocked) && (noActionCount >= FORCE_TRIGGER_LIMIT)) {
            result = triggerSpecialCard(negUnlocked, luckUnlocked, resUnlocked);
            noActionCount = 0;
        } 
        // B. 正常隨機抽取 (機率性包含道具)
        else {
            let currentTempPool = [...pool];
            if (negUnlocked) currentTempPool.push(...negativeQueue);
            if (luckUnlocked) currentTempPool.push(...luckQueue);
            if (resUnlocked) currentTempPool.push(...resurrectionQueue);

            const index = Math.floor(Math.random() * currentTempPool.length);
            result = currentTempPool[index];

            if (typeof result === 'number') {
                pool = pool.filter(n => n !== result);
                noActionCount++;
            } else {
                removeSpecialFromQueue(result);
                noActionCount = 0;
            }
        }
    }

    drawn.push(result);
    display.innerText = result;
    updateDescription(result);
    updateHistory();
}
</script>

</body>
</html>
